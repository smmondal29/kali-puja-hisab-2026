<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🪔 অভিযাত্রী সংঘ - কালী পুজো হিসাব ২০২৬</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#4338ca">
</head>
<body class="bg-gray-100 min-h-screen font-sans pb-12">

    <!-- Fixed Top Header & Summary Bar -->
    <div class="fixed top-0 left-0 right-0 z-50 shadow-md bg-indigo-700">
        <div class="text-white py-2 px-4 text-center">
            <div class="flex items-center justify-center space-x-3 mb-1">
                <span class="text-2xl animate-pulse">🌺</span>
                <img src="kali.jpeg" alt="ঠাকুরের ছবি" class="w-16 h-16 rounded-full object-cover border-2 border-white shadow-lg">
                <span class="text-2xl animate-pulse">🌺</span>
            </div>
            
            <h1 class="text-base sm:text-lg font-bold">🪔 অভিযাত্রী সংঘ (২০২৬)</h1>
            <p class="text-[10px] sm:text-xs text-indigo-200">শঙ্করপুর (মাঝেরপাড়া), রাধাকান্তপুর, মেমারি</p>
        </div>

        <!-- Always Visible Summary Bar -->
        <div class="bg-white p-2 border-t border-indigo-600">
            <div class="container mx-auto max-w-3xl grid grid-cols-4 gap-1 text-center">
                <div class="bg-purple-50 p-1.5 sm:p-2 rounded border border-purple-200">
                    <p class="text-gray-500 text-[9px] sm:text-xs font-medium">মোট ধার্য target</p>
                    <p id="total-target" class="text-xs sm:text-base font-bold text-purple-600">₹০</p>
                    <p id="target-diff" class="text-[8px] sm:text-[10px] font-semibold text-gray-500">(₹০)</p>
                </div>
                <div class="bg-green-50 p-1.5 sm:p-2 rounded border border-green-200">
                    <p class="text-gray-500 text-[9px] sm:text-xs font-medium">মোট আদায়</p>
                    <p id="total-collected" class="text-xs sm:text-base font-bold text-green-600">₹০</p>
                </div>
                <div class="bg-red-50 p-1.5 sm:p-2 rounded border border-red-200">
                    <p class="text-gray-500 text-[9px] sm:text-xs font-medium">মোট খরচ</p>
                    <p id="total-expense-display" class="text-xs sm:text-base font-bold text-red-600">₹০</p>
                </div>
                <div class="bg-blue-50 p-1.5 sm:p-2 rounded border border-blue-200">
                    <p class="text-gray-500 text-[9px] sm:text-xs font-medium">হাতে ক্যাশ</p>
                    <p id="cash-in-hand" class="text-xs sm:text-base font-bold text-blue-600">₹০</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container mx-auto p-4 max-w-3xl space-y-6 pt-48 sm:pt-52">
        
        <!-- Add Member / Pre-set Chanda Section -->
        <div class="bg-white p-4 rounded-lg shadow border">
            <h2 class="text-sm font-bold mb-3 text-gray-700">➕ মেম্বার ও ধার্য টাকা যোগ করুন</h2>
            <form id="member-form" onsubmit="addMember(event)" class="space-y-3">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input type="text" id="member-name" placeholder="মেম্বারের নাম (বাংলায় লিখুন)" autocomplete="off" required class="w-full p-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <input type="number" id="fixed-amount" placeholder="ধার্য টাকা (যেমন: ৮০০)" value="800" required class="w-full p-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white p-2 rounded text-sm hover:bg-indigo-700 font-semibold shadow">লিস্টে যোগ করুন</button>
            </form>
        </div>

        <!-- Member List Table -->
        <div class="bg-white p-4 rounded-lg shadow border">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-bold text-gray-700">📋 চাঁদার খতিয়ান (Paid & Due)</h3>
                <button onclick="downloadChandaPDF()" class="bg-green-600 text-white text-xs px-3 py-1.5 rounded font-semibold hover:bg-green-700 shadow">📥 চাঁদার PDF ডাউনলোড</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-gray-100 border-b text-gray-600">
                            <th class="p-2">নাম</th>
                            <th class="p-2">ধার্য</th>
                            <th class="p-2">জমা</th>
                            <th class="p-2">স্ট্যাটাস / অ্যাকশন</th>
                            <th class="p-2 text-center">মুছুন</th>
                        </tr>
                    </thead>
                    <tbody id="member-table-body">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Expense Section -->
        <div class="bg-white p-4 rounded-lg shadow border">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-bold text-gray-700">💸 খরচের হিসাব যোগ করুন</h3>
                <button onclick="downloadExpensePDF()" class="bg-red-600 text-white text-xs px-3 py-1.5 rounded font-semibold hover:bg-red-700 shadow">📥 খরচের PDF ডাউনলোড</button>
            </div>
            <form id="expense-form" onsubmit="addExpense(event)" class="space-y-3">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input type="text" id="expense-title" placeholder="কী বাবদ খরচ (যেমন: লাইটিং)" autocomplete="off" required class="w-full p-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <input type="number" id="expense-amount" placeholder="টাকার পরিমাণ" required class="w-full p-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" class="w-full bg-red-600 text-white p-2 rounded text-sm hover:bg-red-700 font-semibold shadow">খরচ এন্ট্রি করুন</button>
            </form>
            
            <div class="mt-4">
                <h4 class="text-xs font-bold text-gray-500 mb-2 uppercase">খরচের তালিকা</h4>
                <ul id="expense-list" class="divide-y text-sm">
                    <!-- Dynamic Expenses -->
                </ul>
            </div>
        </div>

        <!-- Reset Button at Bottom -->
        <div class="text-center pt-4">
            <button onclick="resetData()" class="text-xs bg-red-100 text-red-600 hover:bg-red-200 px-4 py-2 rounded font-semibold border border-red-300">⚠️ সব হিসাব রিসেট করুন</button>
        </div>

    </div>

    <!-- Hidden PDF Container -->
    <div id="pdf-content" style="display:none;"></div>

    <!-- html2pdf Library for perfect rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        let members = JSON.parse(localStorage.getItem('abhijatri_members_2026')) || [];
        let expenses = JSON.parse(localStorage.getItem('abhijatri_expenses_2026')) || [];

        function saveData() {
            localStorage.setItem('abhijatri_members_2026', JSON.stringify(members));
            localStorage.setItem('abhijatri_expenses_2026', JSON.stringify(expenses));
            renderUI();
        }

        function addMember(e) {
            e.preventDefault();
            const nameInput = document.getElementById('member-name');
            const amountInput = document.getElementById('fixed-amount');
            
            const name = nameInput.value.trim();
            const fixed = parseFloat(amountInput.value);

            if (!name) return;

            members.push({ id: Date.now(), name, fixed, paid: 0 });
            nameInput.value = '';
            saveData();
        }

        function updatePaid(id, customPaid = null) {
            const member = members.find(m => m.id === id);
            if (!member) return;

            let paidAmount = customPaid !== null ? parseFloat(customPaid) : (member.paid > 0 ? 0 : member.fixed);
            member.paid = isNaN(paidAmount) ? 0 : paidAmount;
            saveData();
        }

        function editPaidPrompt(id) {
            const member = members.find(m => m.id === id);
            const input = prompt(`${member.name}-এর কাছ থেকে কত টাকা আদায় হলো লিখুন:`, member.paid);
            if (input !== null) {
                updatePaid(id, input);
            }
        }

        function deleteMember(id) {
            if(confirm('আপনি কি এই মেম্বারের হিসাব মুছে ফেলতে চান?')) {
                members = members.filter(m => m.id !== id);
                saveData();
            }
        }

        function addExpense(e) {
            e.preventDefault();
            const titleInput = document.getElementById('expense-title');
            const amountInput = document.getElementById('expense-amount');

            const title = titleInput.value.trim();
            const amount = parseFloat(amountInput.value);

            if (!title) return;

            expenses.push({ id: Date.now(), title, amount });
            document.getElementById('expense-form').reset();
            saveData();
        }

        function deleteExpense(id) {
            if(confirm('আপনি কি এই খরচের এন্ট্রি মুছে ফেলতে চান?')) {
                expenses = expenses.filter(ex => ex.id !== id);
                saveData();
            }
        }

        function resetData() {
            if(confirm('সতর্কতা! ক্লাবের সমস্ত হিসাব মুছে ফেলতে চান?')) {
                localStorage.clear();
                members = [];
                expenses = [];
                renderUI();
            }
        }

        function renderUI() {
            const tableBody = document.getElementById('member-table-body');
            const expenseList = document.getElementById('expense-list');
            
            tableBody.innerHTML = '';
            expenseList.innerHTML = '';

            let totalTarget = 0, totalCollected = 0, totalExpense = 0;

            members.forEach(m => {
                totalTarget += m.fixed;
                totalCollected += m.paid;
                let statusButton = '';
                
                if (m.paid >= m.fixed && m.paid > 0) {
                    let extra = m.paid - m.fixed;
                    let extraText = extra > 0 ? ` (+₹${extra})` : '';
                    statusButton = `<button onclick="editPaidPrompt(${m.id})" class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-semibold hover:bg-green-200">Paid${extraText} (পরিবর্তন)</button>`;
                } else if (m.paid > 0 && m.paid < m.fixed) {
                    let due = m.fixed - m.paid;
                    statusButton = `<button onclick="editPaidPrompt(${m.id})" class="bg-yellow-100 text-yellow-800 px-2 py-1 rounded text-xs font-semibold hover:bg-yellow-200">Due ₹${due} (বকেয়া)</button>`;
                } else {
                    statusButton = `<button onclick="updatePaid(${m.id}, ${m.fixed})" class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-semibold hover:bg-red-200">Due (টাকা তুলুন)</button>`;
                }

                tableBody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-2 font-medium">${m.name}</td>
                        <td class="p-2">₹${m.fixed}</td>
                        <td class="p-2 font-bold text-indigo-600">₹${m.paid}</td>
                        <td class="p-2">${statusButton}</td>
                        <td class="p-2 text-center">
                            <button onclick="deleteMember(${m.id})" class="text-red-500 hover:text-red-700 text-xs">❌</button>
                        </td>
                    </tr>
                `;
            });

            expenses.forEach(ex => {
                totalExpense += ex.amount;
                expenseList.innerHTML += `
                    <li class="py-2 flex justify-between items-center border-b last:border-b-0">
                        <span>${ex.title}</span>
                        <div class="flex items-center space-x-2">
                            <span class="font-semibold text-red-600">₹${ex.amount}</span>
                            <button onclick="deleteExpense(${ex.id})" class="text-red-400 hover:text-red-600 text-xs">❌</button>
                        </div>
                    </li>
                `;
            });

            document.getElementById('total-target').innerText = `₹${totalTarget}`;
            document.getElementById('total-collected').innerText = `₹${totalCollected}`;
            document.getElementById('total-expense-display').innerText = `₹${totalExpense}`;
            document.getElementById('cash-in-hand').innerText = `₹${totalCollected - totalExpense}`;

            const diff = totalCollected - totalTarget;
            const diffElement = document.getElementById('target-diff');
            if (diff >= 0) {
                diffElement.innerText = `(+₹${diff} অতিরিক্ত)`;
                diffElement.className = "text-[8px] sm:text-[10px] font-semibold text-green-600";
            } else {
                diffElement.innerText = `(₹${Math.abs(diff)} কম)`;
                diffElement.className = "text-[8px] sm:text-[10px] font-semibold text-red-500";
            }
        }

        // PDF Generation with English Header and Bengali Table Data
        function downloadChandaPDF() {
            let totalPaid = members.reduce((sum, m) => sum + m.paid, 0);
            
            let rowsHtml = '';
            members.forEach((m, index) => {
                let statusText = m.paid >= m.fixed ? "পরিশোধিত (Paid)" : `বকেয়া (Due: Rs. ${m.fixed - m.paid})`;
                rowsHtml += `<tr>
                    <td style="border: 1px solid #ddd; padding: 8px; text-align: center;">${index + 1}</td>
                    <td style="border: 1px solid #ddd; padding: 8px;">${m.name}</td>
                    <td style="border: 1px solid #ddd; padding: 8px; text-align: right;">Rs. ${m.fixed}</td>
                    <td style="border: 1px solid #ddd; padding: 8px; text-align: right;">Rs. ${m.paid}</td>
                    <td style="border: 1px solid #ddd; padding: 8px; text-align: center;">${statusText}</td>
                </tr>`;
            });

            const pdfContainer = document.getElementById('pdf-content');
            pdfContainer.innerHTML = `
                <div style="padding: 20px; font-family: sans-serif; color: #333;">
                    <h2 style="text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 2px;">ABHIJATRI SANGHA (2026)</h2>
                    <h3 style="text-align: center; font-size: 14px; font-weight: bold; margin-top: 2px; margin-bottom: 2px;">KALI PUJA CHANDA LIST</h3>
                    <p style="text-align: center; font-size: 10px; color: #555; margin-bottom: 12px;">Shankarpur (Majherpara), Radhakantapur, Memari</p>
                    <hr style="border: 0.5px solid #000; margin-bottom: 12px;">
                    <p style="font-weight: bold; font-size: 11px; margin-bottom: 8px;">Total Collected: Rs. ${totalPaid}/-</p>
                    <table style="width: 100%; border-collapse: collapse; font-size: 10px;">
                        <thead>
                            <tr style="background-color: #4338ca; color: white;">
                                <th style="border: 1px solid #ddd; padding: 6px; text-align: center;">ক্রমিক</th>
                                <th style="border: 1px solid #ddd; padding: 6px;">মেম্বারের নাম</th>
                                <th style="border: 1px solid #ddd; padding: 6px; text-align: right;">ধার্য টাকা</th>
                                <th style="border: 1px solid #ddd; padding: 6px; text-align: right;">জমা টাকা</th>
                                <th style="border: 1px solid #ddd; padding: 6px; text-align: center;">স্ট্যাটাস</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>
                </div>
            `;

            const opt = {
                margin:       10,
                filename:     'Abhijatri_Sangha_Chanda_2026.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().from(pdfContainer).set(opt).save();
        }

        function downloadExpensePDF() {
            let totalExpense = expenses.reduce((sum, ex) => sum + ex.amount, 0);
            
            let rowsHtml = '';
            expenses.forEach((ex, index) => {
                rowsHtml += `<tr>
                    <td style="border: 1px solid #ddd; padding: 8px; text-align: center;">${index + 1}</td>
                    <td style="border: 1px solid #ddd; padding: 8px;">${ex.title}</td>
                    <td style="border: 1px solid #ddd; padding: 8px; text-align: right;">Rs. ${ex.amount}</td>
                </tr>`;
            });

            const pdfContainer = document.getElementById('pdf-content');
            pdfContainer.innerHTML = `
                <div style="padding: 20px; font-family: sans-serif; color: #333;">
                    <h2 style="text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 2px;">ABHIJATRI SANGHA (2026)</h2>
                    <h3 style="text-align: center; font-size: 14px; font-weight: bold; margin-top: 2px; margin-bottom: 2px;">KALI PUJA EXPENSE LIST</h3>
                    <p style="text-align: center; font-size: 10px; color: #555; margin-bottom: 12px;">Shankarpur (Majherpara), Radhakantapur, Memari</p>
                    <hr style="border: 0.5px solid #000; margin-bottom: 12px;">
                    <p style="font-weight: bold; font-size: 11px; margin-bottom: 8px;">Total Expense: Rs. ${totalExpense}/-</p>
                    <table style="width: 100%; border-collapse: collapse; font-size: 10px;">
                        <thead>
                            <tr style="background-color: #dc2626; color: white;">
                                <th style="border: 1px solid #ddd; padding: 6px; text-align: center;">ক্রমিক</th>
                                <th style="border: 1px solid #ddd; padding: 6px;">খরচের বিবরণ</th>
                                <th style="border: 1px solid #ddd; padding: 6px; text-align: right;">পরিমাণ</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>
                </div>
            `;

            const opt = {
                margin:       10,
                filename:     'Abhijatri_Sangha_Expense_2026.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().from(pdfContainer).set(opt).save();
        }

        renderUI();
    </script>
</body>
</html>
